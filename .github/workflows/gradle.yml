name: Java CI with Gradle

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]
    
permissions:
  contents: read
  
jobs:
  build-spring:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Make application.yml
      run: |
        cd ./src/main/resources
        touch ./application.yml
        echo "${{ secrets.APPLICATION }} > ./application-dev.yml
        touch ./application-default.yml
        echo "${{ secrets.APPLICATION_DEFAULT }} > ./application-dev.yml
      shell: bash

    - name: Build with Gradle
      uses: gradle/gradle-build-action@67421db6bd0bf253fb4bd25b31ebb98943c375e1
      with:
        arguments: clean bootJar

  # build-docker-image:
  
  #   runs-on: ubuntu-latest
  #   steps:
  #   - uses: actions/checkout@v4
    
  #   # 자바 17 세팅
  #   - name: Set up JDK 17
  #     uses: actions/setup-java@v4
  #     with:
  #       java-version: '17'
  #       distribution: 'temurin'
        
  #   # 2. Spring Boot 애플리케이션 빌드
  #   - name: Build with Gradle
  #     uses: gradle/gradle-build-action@67421db6bd0bf253fb4bd25b31ebb98943c375e1
  #     with:
  #       arguments: clean bootJar

    # 3. Docker 이미지 빌드
    - name: docker image build
      run: docker build --platform linux/amd64 --build-arg DEPENDENCY=build/dependency --tag ${{ secrets.DOCKER_USERNAME }}/nonghaeng-be-test .

    # 4. DockerHub 로그인
    - name: docker login
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 5. Docker Hub 이미지 푸시
    - name: docker Hub push
      run: docker push ${{ secrets.DOCKER_USERNAME }}/nonghaeng-be-test
