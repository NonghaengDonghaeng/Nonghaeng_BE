name: Java CI with Gradle

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]
    
permissions:
  contents: read
  
jobs:
  build-docker-image:
    runs-on: self-hosted
    
    steps:
    - uses: actions/checkout@v3
    # 1. java 17 세팅
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    # 2. application.yml 생성
    - name: Make application.yml
      run: |
        cd ./src/main/resources
        touch ./application.yml
        echo "${{ secrets.APPLICATION }}" | base64 --decode > ./application.yml
        cat ./application.yml
        touch ./application.yml
        echo "${{ secrets.APPLICATION_DEFAULT_YML }}" | base64 --decode > ./application-default.yml
        cat ./application-default.yml
        
      shell: bash
        
    # 3. Spring Boot 애플리케이션 빌드
    - name: Build with Gradle
      uses: gradle/gradle-build-action@67421db6bd0bf253fb4bd25b31ebb98943c375e1
      with:
        arguments: clean bootJar
      
    # 3. Docker 이미지 빌드
    - name: docker image build
      run: docker build --platform linux/amd64 --build-arg DEPENDENCY=build/dependency --tag ${{ secrets.DOCKER_USERNAME }}/nonghaeng-be-test .

    # 4. DockerHub 로그인
    - name: docker login
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 5. Docker Hub 이미지 푸시
    - name: docker Hub push
      run: docker push ${{ secrets.DOCKER_USERNAME }}/nonghaeng-be-test
    
    # 6. ssh 로그인
    - name: execute remote ssh
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.REMOTE_SSH_HOST }}
        username: ${{ secrets.REMOTE_SSH_USERNAME }}
        key: ${{ secrets.REMOTE_SSH_KEY }}
        port: ${{ secrets.REMOTE_SSH_PORT }}
        script: |
          whoami

